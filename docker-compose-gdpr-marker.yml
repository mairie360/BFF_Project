# GDPR log marker stack (MAIR-290) for the BFF Project: the services of docker-compose-integration.yml
# (published Project API and Core API images, seeded database, Redis) plus the `gdpr-marker` runner of
# mairie360/CICD (tests/gdpr/marker), which plays gdpr-marker.yaml with a marker user through the BFF.
# gdpr_marker_test.sh then searches the logs of every container (the BFF, its upstream APIs, Postgres,
# Redis) for its values.
#
#   ./gdpr_marker_test.sh                    (local: builds bff-project:local from development.Dockerfile)
#   IMAGE_REF=<image> ./gdpr_marker_test.sh  (CI: the image promoted to staging)
#
# The database images are Database main's dev build carrying the GDPR schema. JWT_SECRET and ADMIN_JWT
# come from stack_secrets.sh (random secret per run, MAIR-428).

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:dev-c5b8e22}
    container_name: bff-project-gdpr-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true.
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:dev-c5b8e22}
    container_name: bff-project-gdpr-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: bff-project-gdpr-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: bff-project-gdpr-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:2.2.0}
    container_name: bff-project-gdpr-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Lift the API rate limit (MAIR-425): the scan and the load test hammer it as one user.
      RATE_LIMIT_ENABLED: "false"
      # Core refuses to start without its Resend configuration (MAIR-522). No route of this BFF sends an
      # e-mail, so the key is fake and the URL never called.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3000
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://core-api:3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-api-ready ci-dessous.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: bff-project-gdpr-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    # Bounded wait (90 tries, 3 min): an upstream that never answers fails `docker compose up` instead of
    # blocking the gate until the job timeout.
    command: >
      sh -c 'i=0; until curl -fsS http://core-api:3000/health >/dev/null; do
      i=$$((i+1)); if [ $$i -ge 90 ]; then echo "core-api not ready after 3 min"; exit 1; fi;
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  project-api:
    # Project API main's dev build: 1.2.0 (docker-compose-integration.yml) logs the query string of every
    # request (`?search=<name>`), fixed by Project_API MAIR-290 (#139), not released yet.
    image: ${PROJECT_API_IMAGE:-ghcr.io/mairie360/project-api:dev-33fd18c}
    container_name: bff-project-gdpr-project-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3001
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://project-api:3001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
    expose:
      - "3001"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur project-api-ready ci-dessous.

  project-api-ready:
    image: curlimages/curl:latest
    container_name: bff-project-gdpr-project-api-ready
    depends_on:
      project-api:
        condition: service_started
    # Bounded wait (90 tries, 3 min): an upstream that never answers fails `docker compose up` instead of
    # blocking the gate until the job timeout.
    command: >
      sh -c 'i=0; until curl -fsS http://project-api:3001/health >/dev/null; do
      i=$$((i+1)); if [ $$i -ge 90 ]; then echo "project-api not ready after 3 min"; exit 1; fi;
      echo "waiting for project-api..."; sleep 2; done; echo "project-api ready"'
    networks:
      - backend

  bff-project:
    image: ${IMAGE_REF:-bff-project:local}
    container_name: bff-project-gdpr-bff
    depends_on:
      seeder:
        condition: service_completed_successfully
      project-api-ready:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      # No DB variable: the BFF only reads Project API and Core API.
      HOST: "0.0.0.0"
      PORT: 4001
      CORE_API_URL: core-api
      CORE_API_PORT: 3000
      PROJECT_API_URL: project-api
      PROJECT_API_PORT: 3001
      # Verifies the session tokens before any upstream call (bffs-lib requireSession, MAIR-474).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
    expose:
      - "4001"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  gdpr-marker:
    image: node:26-bookworm-slim
    container_name: bff-project-gdpr-marker
    user: "${GDPR_UID:-0}:${GDPR_GID:-0}"
    depends_on:
      bff-project:
        condition: service_healthy
    environment:
      # Admin JWT of the run (sub=1, the seeded Admin), signed by stack_secrets.sh with its JWT_SECRET.
      ADMIN_JWT: ${ADMIN_JWT:?ADMIN_JWT is generated by stack_secrets.sh, run gdpr_marker_test.sh}
    volumes:
      - ./cicd-repo/tests/gdpr:/engine:ro
      - ./gdpr-marker.yaml:/journey/gdpr-marker.yaml:ro
      - ./gdpr-report:/report
    command: ["/engine/marker/run.sh"]
    networks:
      - backend
