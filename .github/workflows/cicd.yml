name: BFF Project CICD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  CICD:
    # [NOUVEAU] MAIR-493 : TEMPORAIRE, test de mairie360/CICD#142. Repasser `uses` et `cicd_version` sur le tag publie avant merge.
    uses: mairie360/CICD/.github/workflows/BFFs-cicd.yml@mair-493-actions-by-check-and-stack
    with:
      package_name: bff-project
      node_version: "24"
      cicd_version: mair-493-actions-by-check-and-stack
      openapi_spec_path: contracts/openapi.json
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
