name: BFF Project CICD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  CICD:
    uses: mairie360/CICD/.github/workflows/BFFs-cicd.yml@v4.4.0
    with:
      package_name: bff-project
      node_version: "24"
      cicd_version: v4.4.0
      openapi_spec_path: contracts/openapi.json
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PK: ${{ secrets.RELEASE_APP_PK }}
