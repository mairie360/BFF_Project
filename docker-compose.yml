volumes:
  redis-data:
  bff-project-target:

networks:
  backend:
  user_backend:
    external: true
    name: ${USER_BACKEND_NETWORK:-bff_user_backend}

secrets:
  npmrc:
    file: .npmrc
  npm_token:
    environment: NODE_AUTH_TOKEN

# The BFF reads neither PostgreSQL nor Redis: everything goes through Project API and Core API (never another BFF, MAIR-525).
x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 4001

x-depends-on: &depends-on
  redis:
    condition: service_healthy

# x-healthcheck: &healthcheck
#   test: ["CMD", "curl", "-f", "http://localhost:4001"]
#   interval: 10s
#   timeout: 5s
#   retries: 5

x-service: &service-template
  image: ghcr.io/mairie360/service_name:latest
  pull_policy: always
  restart: always
  expose:
    - "4001"
  networks:
    - backend
  # healthcheck:
  #   <<: *healthcheck

services:
  redis:
    image: redis:8.4.0-bookworm@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
    container_name: mairie360-redis-project-bff #change bff name
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # core:
  #   container_name: core-project-bff-developpement
  #   image: ghcr.io/mairie360/core-api:dev-156a9b9
  #   ports:
  #     - "3000:3000"
  #   networks:
  #     - backend
  #   dns:
  #     - 8.8.8.8
  #     - 1.1.1.1
  #   environment:
  #     HOST: "0.0.0.0"
  #     PORT: 3000
  #     REDIS_URL: redis://redis:6379
  #     DB_TYPE: postgres
  #     DB_NAME: mairie_360_database
  #     DB_USER: postgres
  #     DB_HOST: postgres
  #     DB_PASSWORD: password
  #     DB_PORT: 5432
  #     PUBLIC_URL: http://core.development.mairie360.fr
  #     JWT_SECRET: b"secret"
  #     JWT_TIMEOUT: 3600
  #     JWT_ALLOW_WEAK_SECRET: "true"
  #   depends_on:
  #     liquibase:
  #       condition: service_completed_successfully
  #     redis:
  #       condition: service_healthy

  project-api:
    container_name: project-api-bff-project-developpement
    image: ghcr.io/mairie360/project-api:dev-9a2f251
    ports:
      - "3001:3001"
    networks:
      - backend
      - user_backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      HOST: "0.0.0.0"
      PORT: 3001
      REDIS_URL: redis://redis:6379
      DB_TYPE: postgres
      DB_NAME: mairie_360_database
      DB_USER: postgres
      DB_HOST: ${SHARED_DB_HOST:-postgres}
      DB_PASSWORD: password
      DB_PORT: 5432
      PUBLIC_URL: http://project.development.mairie360.fr
      JWT_SECRET: b"secret"
      # MAIR-680: the public key of the Core that signs this stack's sessions (local or remote), from the
      # shell (`source ./stack_secrets.sh` gives a pair only for a Core started here with it); JWT_SECRET
      # is the HS256 transition of the dev stack only.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_TIMEOUT: 3600
      # mairie360_api_lib >= 2.0 refuses the well-known b"secret" without this flag (MAIR-428): local dev only.
      JWT_ALLOW_WEAK_SECRET: "true"
    depends_on:
      redis:
        condition: service_healthy

  #add other apis if needed

  bff-project:
    container_name: bff-project-developpement
    build:
      context: .
      dockerfile: development.Dockerfile
      secrets:
        - npmrc
        - npm_token
    # Mode synchronisation en temps réel (Docker Compose V2)
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: package.json
    ports:
      - "4001:4001"
    networks:
      - backend
      - user_backend
    environment:
      <<: *common-env
      # IMPORTANT : On utilise le nom du service Docker pour communiquer
      CORE_API_URL: "core-bff-user-developpement"
      CORE_API_PORT: 3000
      PROJECT_API_URL: "project-api"
      PROJECT_API_PORT: 3001
      # Same development secret as the APIs and BFF User of the local stacks: the BFF verifies the session
      # tokens with it (bffs-lib requireSession, MAIR-474) and refuses to start without it.
      JWT_SECRET: b"secret"
      # MAIR-680: the public key of the Core that signs this stack's sessions (local or remote), from the
      # shell (`source ./stack_secrets.sh` gives a pair only for a Core started here with it); JWT_SECRET
      # is the HS256 transition of the dev stack only.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
    volumes:
      - /app/node_modules # Isolation des modules pour éviter les conflits OS (Mac/Windows vs Linux)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

