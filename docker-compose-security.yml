# Isolated dynamic security test (DAST) stack for the BFF Project.
#
#   ./security_test.sh                 (local)
#   IMAGE_REF=<image> ./security_test.sh   (CI: the image published by release-dev)
#
# The BFF under test is never built by this file: it runs the image named by
# IMAGE_REF, which the CI sets to the dev image built once by release-dev and
# then promoted to staging and prod. When IMAGE_REF is empty, the script builds
# bff-project:local from development.Dockerfile first (NODE_AUTH_TOKEN and ./.npmrc
# are needed to read the @mairie360/* packages).
#
# security-scan (OWASP ZAP) imports /openapi.json, replays every operation with
# a valid JWT (replacer) and fails on any WARN/FAIL alert not neutralized in
# .zap/rules.tsv (informational alerts are set to IGNORE there).
#
# BFF Project calls BFF User to resolve the session (/me): like the BFF User
# stack, it therefore embeds Core API + BFF User on top of Project API.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:1.3.0}
    container_name: bff-project-sec-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:1.3.0}
    container_name: bff-project-sec-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: bff-project-sec-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: bff-project-sec-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:1.2.0}
    container_name: bff-project-sec-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3000
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://core-api:3000
      JWT_SECRET: b"secret"
      JWT_TIMEOUT: 3600
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-api-ready ci-dessous.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: bff-project-sec-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core-api:3000/health >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  project-api:
    image: ${PROJECT_API_IMAGE:-ghcr.io/mairie360/project-api:0.5.1}
    container_name: bff-project-sec-project-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3001
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://project-api:3001
      JWT_SECRET: b"secret"
      JWT_TIMEOUT: 3600
    expose:
      - "3001"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur project-api-ready ci-dessous.

  project-api-ready:
    image: curlimages/curl:latest
    container_name: bff-project-sec-project-api-ready
    depends_on:
      project-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://project-api:3001/health >/dev/null; do
      echo "waiting for project-api..."; sleep 2; done; echo "project-api ready"'
    networks:
      - backend

  bff-user:
    image: ${BFF_USER_IMAGE:-ghcr.io/mairie360/bff-user:0.5.0}
    container_name: bff-project-sec-bff-user
    depends_on:
      seeder:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 4000
      REDIS_URL: redis://redis:6379
      JWT_SECRET: 'b"secret"'
      CORE_API_URL: http://core-api:3000
    expose:
      - "4000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  bff-project:
    image: ${IMAGE_REF:-bff-project:local}
    container_name: bff-project-sec-bff
    depends_on:
      seeder:
        condition: service_completed_successfully
      project-api-ready:
        condition: service_completed_successfully
      bff-user:
        condition: service_healthy
    environment:
      # Aucune variable DB : le BFF ne lit que Project API, Core API et BFF User.
      HOST: "0.0.0.0"
      PORT: 4001
      CORE_API_URL: core-api
      CORE_API_PORT: 3000
      PROJECT_API_URL: project-api
      PROJECT_API_PORT: 3001
      PROJECT_API_BASE_PATH: http://project-api:3001
      USER_BFF_URL: http://bff-user:4000
    expose:
      - "4001"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  security-scan:
    image: zaproxy/zap-stable
    container_name: bff-project-sec-zap
    depends_on:
      bff-project:
        condition: service_healthy
      bff-user:
        condition: service_healthy
    volumes:
      - ./.zap/rules.tsv:/zap/wrk/rules.tsv:ro
    # -c rules.tsv: informational alerts are set to IGNORE, any other alert
    #   (WARN/FAIL) makes zap-api-scan.py exit non-zero.
    # -z ... replacer: injects a static HS256 JWT (sub=1, the Admin user seeded by
    #   init-test.sql, exp=2100, signed with JWT_SECRET=b"secret") on every request,
    #   so every operation is scanned as an authenticated admin.
    # -silent: no check-for-update or telemetry when the ZAP daemon starts (otherwise
    #   it can hang on add-on updates and fail with "Failed to connect to ZAP").
    # -z is split with shlex: 'Bearer <jwt>' must stay quoted, otherwise ZAP only
    #   receives "replacement=Bearer" and every authenticated route answers 401.
    # formhandler: ZAP ignores the contract example of a field named "password" and sends
    #   "ZAP", below the 8-character minimum. Defining one field replaces ZAP's whole
    #   default list, so every other field takes its example from the contract.
    command:
      - zap-api-scan.py
      - -t
      - http://bff-project:4001/openapi.json
      - -f
      - openapi
      - -c
      - rules.tsv
      - -z
      - "-silent -config formhandler.fields.field(0).fieldId=password -config formhandler.fields.field(0).value=Zap-Scan-Passw0rd -config formhandler.fields.field(0).enabled=true -config replacer.full_list(0).description=auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement='Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwicm9sZSI6ImFkbWluIiwiZXhwIjo0MTAyNDQ0ODAwfQ.xCeBe_2QxRlXW8WXr3t6F69wbEHA93HbP_7l4OTJwjA'"
    networks:
      - backend
